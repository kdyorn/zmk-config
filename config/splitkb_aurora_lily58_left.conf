# --- USB / BLE ---
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# --- Keep board awake for photos ---
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0

# --- Turn key LEDs on (addressable underglow used for key illumination) ---
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRIGHTNESS=80
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
